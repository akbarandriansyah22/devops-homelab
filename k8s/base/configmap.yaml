apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-api
  namespace: ecommerce
data:
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "8080"
  ENVIRONMENT: "staging"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "ecommerce"
  DB_SSLMODE: "disable"
  DB_USER: "postgres"
  APP_NAME: "E-Commerce API"
  APP_VERSION: "1.0.0"
  LOG_LEVEL: "info"
