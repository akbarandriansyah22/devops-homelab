name: Publish image to GHCR

# CD lama memakai workflow_run. Trigger itu hanya tembak setelah CI
# bernama persis "Go CI + DevSecOps Pipeline" selesai di main.
# CI ber-path-filter, jadi merge k8s/terraform tidak menjalankan CI — CD kosong.
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "ecommerce-api/**"
      - ".github/workflows/cd.yml"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: akbarandriansyah22/devops-homelab/ecommerce-api

concurrency:
  group: ghcr-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=main-
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./ecommerce-api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
